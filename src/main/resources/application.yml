spring:
  application:
    name: recruitment-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recruitment}
    username: ${DB_USERNAME:recruitment}
    password: ${DB_PASSWORD:recruitment_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
      fail-on-trailing-tokens: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
