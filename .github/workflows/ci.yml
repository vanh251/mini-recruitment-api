name: Java 17 build and PostgreSQL tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: recruitment_test
          POSTGRES_USER: recruitment
          POSTGRES_PASSWORD: recruitment_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recruitment -d recruitment_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit tests, integration tests, format and lint
        run: ./mvnw -B clean verify -Ppostgres-it
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
